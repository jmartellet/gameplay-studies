name: pedirjogo

on:
  push:
    branches: [main]
    paths:
      - 'pedirjogo/**'
      - '.github/workflows/pedirjogo.yml'
  pull_request:
    paths:
      - 'pedirjogo/**'
      - '.github/workflows/pedirjogo.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pedirjogo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pedirjogo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
